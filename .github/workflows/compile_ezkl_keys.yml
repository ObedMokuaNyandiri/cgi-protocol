name: EZKL Cryptographic Setup Ceremony

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for running the setup ceremony'
        required: false
        default: 'Manual re-compilation of keys'
  push:
    paths:
      - 'cgi/state_reducer.py'
      - 'circuits/compile_ezkl_circuit.py'
    branches:
      - main

jobs:
  compile_keys:
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ezkl==23.0.5 onnx torch

      - name: Run EZKL Compilation Pipeline
        run: |
          # This will run natively on Ubuntu 22.04 LTS, bypassing Windows-specific PyO3 thread limits
          export PYTHONIOENCODING=utf-8
          python circuits/compile_ezkl_circuit.py
          
      - name: Verify Key Generation
        run: |
          ls -lah circuits/ezkl_artifacts/
          if [ ! -f "circuits/ezkl_artifacts/test.pk" ]; then
            echo "Proving key (test.pk) not found!"
            exit 1
          fi

      - name: Upload Cryptographic Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ezkl-cryptographic-keys
          path: |
            circuits/ezkl_artifacts/network.compiled
            circuits/ezkl_artifacts/test.pk
            circuits/ezkl_artifacts/test.vk
            circuits/ezkl_artifacts/settings.json
          retention-days: 90

name: Smart Contract Security Audit (Slither)

on:
  push:
    paths:
      - 'contracts/**/*.sol'
    branches:
      - main
  pull_request:
    paths:
      - 'contracts/**/*.sol'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (for solc versioning)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Run Slither Static Analysis
        uses: crytic/slither-action@v0.3.1
        id: slither
        with:
          node-versions: 20
          sarif: results.sarif
          target: 'contracts/'
          fail-on: none # For V1, we log warnings without completely breaking the build, allowing manual review

      - name: Upload SARIF file for GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.slither.outputs.sarif }}
          category: slither

version: '3.8'

services:
  cgi-gateway:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount directories (not files) for SQLite WAL compatibility
      - ./auth:/app/auth
      - ./outputs:/app/outputs
      - ./logs:/app/logs
      - ./data:/app/data
      # Mount the model (read-only)
      - ./models:/app/models:ro
    environment:
      - ENCLAVE_MODE=software
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - API_KEYS_FILE=auth/api_keys.json
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
        reservations:
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Caddy Reverse Proxy (Automatic HTTPS) ────────────────
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      cgi-gateway:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  caddy_data:
  caddy_config:

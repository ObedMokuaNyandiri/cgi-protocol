[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
script = "script"
test = "test"

# Pin exact compiler version for deterministic ZK verification bridging
solc = "0.8.24"

# Optimizer settings
optimizer = true
optimizer_runs = 200

# Strict compilation rules
via_ir = false
bytecode_hash = "ipfs"
cbor_metadata = true

[fuzz]
runs = 1000

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "thousands"
